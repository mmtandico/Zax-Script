<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steal an Egg - Egg Spawn Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="predictor-wrapper">
        <!-- Top Status Bar -->
        <div class="top-status-bar">
            <div class="brand">⚡ Zxscript Egg Predictor</div>
            <div class="status-right">
                <span class="pulse-dot"></span> Live Sync Online
                <button id="soundToggleBtn" class="sound-btn">🔊 Sound Alerts: ON</button>
            </div>
        </div>

        <!-- MAIN DISCORD / BOT STYLE PREDICTOR CONTAINER -->
        <div class="predictor-card">
            <!-- Next Up Header Banner -->
            <div class="next-up-banner">
                <span class="label">Next up</span>
                <span class="dot-sep">•</span>
                <strong id="nextUpName" class="egg-name-highlight">Tralaledon</strong>
                <span class="dot-sep">•</span>
                <span id="nextUpZone" class="zone-badge">📍 Dino Island</span>
                <span class="dot-sep">•</span>
                <span id="nextUpTime" class="time-badge">6:30 pm</span>
                <span class="dot-sep">•</span>
                <span id="nextUpRelative" class="time-badge muted">in 13 minutes</span>
            </div>

            <div class="predictor-body">
                <!-- SECRET GROUP -->
                <div class="tier-section">
                    <h3 class="tier-title secret">Secret</h3>
                    <div id="secretList" class="egg-list">
                        <!-- Populated dynamically -->
                    </div>
                </div>

                <!-- ETERNAL GROUP -->
                <div class="tier-section">
                    <h3 class="tier-title eternal">Eternal</h3>
                    <div id="eternalList" class="egg-list">
                        <!-- Populated dynamically -->
                    </div>
                </div>

                <!-- DIVINE GROUP -->
                <div class="tier-section">
                    <h3 class="tier-title divine">Divine</h3>
                    <div id="divineList" class="egg-list">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
